<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap');

:root{
  --paper:#F4F7FC; --surface:#FFFFFF; --surface-2:#EEF3FA;
  --ink:#16233A; --ink-soft:#4E6079; --ink-faint:#8497AC;
  --teal-900:#0A2550; --teal-700:#04549E; --teal-600:#0F66B4; --teal-500:#2FA2E6; --teal-100:#E4F0FC;

  --font-head:'Cairo',"Segoe UI",Tahoma,sans-serif;
  --font-body:'Tajawal',"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0A1524; --surface:#101E33; --surface-2:#0C1728;
    --ink:#E9F0FA; --ink-soft:#9DB0C7; --ink-faint:#63768E;
    --teal-900:#CFE6FC; --teal-700:#3AA0E6; --teal-600:#3AA0E6; --teal-500:#5CC0F5; --teal-100:#102B4A;
    --amber-600:#F0BB57; --amber-500:#F0BB57; --amber-100:#3A2E17;
    --red-600:#E2766C; --red-100:#3A2019;
    --line:#243654; --line-soft:#1C2A42;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --paper:#0A1524; --surface:#101E33; --surface-2:#0C1728;
  --ink:#E9F0FA; --ink-soft:#9DB0C7; --ink-faint:#63768E;
  --teal-900:#CFF3EA; --teal-700:#3FC8B8; --teal-600:#3FC8B8; --teal-500:#4FD6C6; --teal-100:#1B302C;
  --amber-600:#F0BB57; --amber-500:#F0BB57; --amber-100:#3A2E17;
  --red-600:#E2766C; --red-100:#3A2019;
  --line:#243654; --line-soft:#1C2A42;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.4);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--font-body);
  font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.head{font-family:var(--font-head);}
h1,h2,h3{text-wrap:balance; margin:0;}
::selection{background:var(--teal-100);}
button{font-family:inherit;}
input,textarea,select{font-family:inherit; font-size:14px; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:9px 11px; width:100%;}
input:focus,textarea:focus,select:focus{outline:2px solid var(--teal-500); outline-offset:1px; border-color:var(--teal-500);}
textarea{resize:vertical; min-height:74px;}
a{color:var(--teal-700);}
button{cursor:pointer;}
button:focus-visible, a:focus-visible, [tabindex]:focus-visible{outline:2px solid var(--teal-500); outline-offset:2px;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px;}
.tabnum{font-variant-numeric:tabular-nums;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

/* ---------- layout ---------- */
#app{min-height:100vh; display:flex; flex-direction:column;}

.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:14px;
  padding:12px 20px; background:var(--surface);
  border-bottom:1px solid var(--line); box-shadow:var(--shadow);
}
.brand{display:flex; align-items:center; gap:10px; flex:1; min-width:0; background:none; border:none; padding:2px; margin:0; text-align:right; cursor:pointer; font-family:inherit; border-radius:10px;}
.brand:hover{background:var(--surface-2);}
.brand-badge{
  width:44px; height:44px; border-radius:11px; flex:none;
  background:#fff;
  display:flex; align-items:center; justify-content:center; font-size:20px; padding:5px;
  box-shadow:var(--shadow);
}
.brand-badge img{width:100%; height:100%; object-fit:contain;}
.brand-text{min-width:0;}
.brand-text .t1{font-family:var(--font-head); font-weight:800; font-size:17px; color:var(--teal-900); line-height:1.2;}
.brand-text .t2{font-size:12.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.top-actions{display:flex; align-items:center; gap:8px; flex:none;}
.save-status{font-size:12.5px; color:var(--ink-faint); display:flex; align-items:center; gap:6px; white-space:nowrap;}
.save-dot{width:7px; height:7px; border-radius:50%; background:var(--ink-faint); flex:none;}
.save-status.ok .save-dot{background:var(--teal-500);}
.save-status.pending .save-dot{background:var(--amber-500); animation:pulse 1.1s infinite;}
.save-status.err .save-dot{background:var(--red-600);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

.btn{
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:10px; padding:9px 14px; font-size:13.5px; font-weight:600;
  display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
  transition:transform .08s ease, background .15s ease;
}
.btn:hover{background:var(--surface-2);}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--teal-700); border-color:var(--teal-700); color:#fff;}
.btn-primary:hover{background:var(--teal-600);}
.btn-amber{background:var(--amber-500); border-color:var(--amber-500); color:var(--teal-900);}
.btn-ghost{background:transparent; border-color:transparent;}
.btn-ghost:hover{background:var(--surface-2);}
.btn-danger{color:var(--red-600); border-color:var(--red-100);}
.btn-danger:hover{background:var(--red-100);}
.btn-sm{padding:6px 10px; font-size:12.5px; border-radius:8px;}
.btn[disabled]{opacity:.5; cursor:not-allowed;}

.shell{flex:1; display:flex; align-items:flex-start;}

.sidebar{
  width:270px; flex:none; padding:16px 14px 40px; position:sticky; top:65px;
  max-height:calc(100vh - 65px); overflow-y:auto;
}
.side-group-label{font-size:11.5px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; padding:14px 10px 6px;}
.side-item{
  display:flex; align-items:center; gap:10px; width:100%; text-align:right;
  padding:9px 10px; border-radius:10px; border:1px solid transparent; background:transparent; color:var(--ink-soft);
  font-size:13.5px; font-weight:600; margin-bottom:2px;
}
.side-item .num{
  flex:none; width:22px; height:22px; border-radius:7px; background:var(--surface-2); color:var(--ink-faint);
  display:flex; align-items:center; justify-content:center; font-size:11px; font-family:var(--font-head); font-weight:700;
}
.side-item span.lbl{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.side-item:hover{background:var(--surface-2);}
.side-item.active{background:var(--teal-100); color:var(--teal-900); border-color:var(--teal-100);}
.side-item.active .num{background:var(--teal-700); color:#fff;}

.main{flex:1; min-width:0; padding:22px 26px 80px;}
.section-head{display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:16px; flex-wrap:wrap;}
.section-head h2{font-size:21px; font-weight:800; color:var(--teal-900); display:flex; align-items:center; gap:10px;}
.section-head h2 .idx{
  font-family:var(--font-head); font-size:12.5px; font-weight:800; color:#fff; background:var(--teal-700);
  width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex:none;
}
.section-actions{display:flex; gap:8px; flex-wrap:wrap;}
.section-intro{
  background:var(--teal-100); color:var(--teal-900); border-radius:12px; padding:12px 14px; font-size:13.5px;
  margin-bottom:16px; line-height:1.7;
}

/* home */
.home-hero{
  position:relative;
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  background:linear-gradient(120deg, var(--teal-900), var(--teal-700));
  color:#fff; border-radius:18px; padding:24px 26px; margin-bottom:26px; box-shadow:var(--shadow);
}
.hh-export-btn{
  position:absolute; top:16px; inset-inline-end:16px;
  width:38px; height:38px; border-radius:50%; flex:none;
  background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.32); color:#fff;
  font-size:16px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  transition:background .15s ease, transform .1s ease; font-family:inherit;
}
.hh-export-btn:hover{background:rgba(255,255,255,.3);}
.hh-export-btn:active{transform:scale(.94);}
.hh-badge{width:120px; height:82px; border-radius:16px; background:#fff; display:flex; align-items:center; justify-content:center; flex:none; padding:8px; box-shadow:0 4px 18px rgba(0,0,0,.18);}
.hh-badge img{width:100%; height:100%; object-fit:contain;}
.hh-text{flex:1; min-width:200px;}
.hh-text h2{font-size:19px; font-weight:800; margin-bottom:6px;}
.hh-text p{margin:0; font-size:13.5px; opacity:.88; line-height:1.6;}
.hh-coord{margin-top:8px !important; opacity:1 !important; background:rgba(255,255,255,.14); display:inline-flex; padding:5px 12px; border-radius:99px; font-size:12.5px !important;}
.hh-coord b{font-weight:800;}
.hh-progress{display:flex; flex-direction:column; align-items:flex-end; gap:6px; min-width:150px;}
.hh-progress-num{font-family:var(--font-head); font-size:22px; font-weight:800;}
.hh-progress-num span{font-size:14px; opacity:.75; font-weight:600;}
.hh-progress-bar{width:150px; height:7px; border-radius:99px; background:rgba(255,255,255,.22); overflow:hidden;}
.hh-progress-fill{height:100%; background:var(--amber-500); border-radius:99px; transition:width .3s ease;}
.hh-progress-lbl{font-size:11.5px; opacity:.8;}

.home-group-label{font-family:var(--font-head); font-weight:800; font-size:14.5px; color:var(--teal-900); margin-bottom:14px; display:flex; align-items:center; gap:8px;}

/* circular icon launcher: two horizontal rows, scrolls sideways if it overflows */
.icon-launcher{
  display:grid; grid-template-rows:repeat(2,1fr); grid-auto-flow:row; grid-template-columns:repeat(10,104px);
  gap:20px 6px; overflow-x:auto; padding:4px 4px 14px;
}
.icon-launch-btn{
  background:none; border:none; font-family:inherit; cursor:pointer; padding:4px;
  display:flex; flex-direction:column; align-items:center; gap:8px; width:104px;
}
.ilb-circle{
  position:relative; width:68px; height:68px; border-radius:50%;
  background:linear-gradient(160deg, var(--teal-100), var(--surface));
  border:1px solid var(--line); box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:center; font-size:27px;
  transition:transform .12s ease, border-color .12s ease;
}
.icon-launch-btn:hover .ilb-circle{transform:translateY(-3px) scale(1.04); border-color:var(--teal-500);}
.ilb-num{
  position:absolute; top:-4px; inset-inline-start:-4px; background:var(--teal-700); color:#fff;
  width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:10px; font-family:var(--font-head); font-weight:700; border:2px solid var(--surface);
}
.ilb-dot{
  position:absolute; bottom:2px; inset-inline-end:2px; width:11px; height:11px; border-radius:50%;
  background:var(--surface); border:2px solid var(--ink-faint); opacity:.55;
}
.ilb-dot.is-filled{background:var(--teal-500); border-color:var(--surface); opacity:1;}
.ilb-label{
  font-size:11.5px; font-weight:600; color:var(--ink-soft); text-align:center; line-height:1.35;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px;}
.card + .card{margin-top:14px;}

/* profile grid */
.profile-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px 16px;}
.profile-grid.wide{grid-template-columns:1fr;}
.field-block label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-faint); margin-bottom:5px;}
.field-view{padding:10px 12px; background:var(--surface-2); border:1px solid var(--line-soft); border-radius:9px; min-height:20px; font-size:14px; color:var(--ink);}
.field-view.empty{color:var(--ink-faint); font-style:italic;}

/* text section */
.text-view{white-space:pre-wrap; line-height:1.85; font-size:14.5px;}

/* records: table */
.table-wrap{overflow-x:auto; border-radius:12px; border:1px solid var(--line);}
table.rt{width:100%; border-collapse:collapse; min-width:560px;}
table.rt th{
  background:var(--surface-2); color:var(--ink-soft); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
  padding:10px 12px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap;
}
table.rt td{padding:11px 12px; border-bottom:1px solid var(--line-soft); font-size:13.5px; vertical-align:top;}
table.rt tr:last-child td{border-bottom:none;}
table.rt tr:hover td{background:var(--surface-2);}
table.rt td.actions{white-space:nowrap; width:1%;}

/* records: cards grid */
.cards-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px;}
.rec-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; display:flex; flex-direction:column; gap:8px;}
.rec-card .rc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.rec-card .rc-title{font-family:var(--font-head); font-weight:700; font-size:14.5px; color:var(--teal-900);}
.rec-card .rc-sub{font-size:12px; color:var(--ink-faint);}
.rec-card .rc-field{font-size:13px; color:var(--ink-soft);}
.rec-card .rc-field b{color:var(--ink); font-weight:600;}
.rec-card .rc-actions{display:flex; gap:6px; margin-top:auto; padding-top:8px;}
.rc-images{display:flex; gap:6px; flex-wrap:wrap; margin-top:4px;}
.rc-images img{width:64px; height:64px; object-fit:cover; border-radius:8px; border:1px solid var(--line); cursor:zoom-in;}

.empty-state{
  text-align:center; padding:40px 20px; color:var(--ink-faint); font-size:13.5px;
  border:1.5px dashed var(--line); border-radius:14px; background:var(--surface-2);
}
.badge{display:inline-flex; align-items:center; padding:2px 9px; border-radius:99px; font-size:11.5px; font-weight:700;}
.badge-teal{background:var(--teal-100); color:var(--teal-700);}
.badge-amber{background:var(--amber-100); color:var(--amber-600);}
.badge-red{background:var(--red-100); color:var(--red-600);}

/* team block (section 7) */
.team-block{border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:14px;}
.team-head{background:var(--teal-900); color:#fff; padding:12px 14px;}
.team-head .tname{font-family:var(--font-head); font-weight:800; font-size:14.5px;}
.team-head .tduty{font-size:12px; opacity:.85; margin-top:4px; line-height:1.6;}

/* modal */
.overlay{position:fixed; inset:0; background:rgba(11,20,18,.5); backdrop-filter:blur(2px); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px;}
.modal{background:var(--surface); border-radius:16px; width:100%; max-width:560px; max-height:88vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.3); border:1px solid var(--line);}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--line);}
.modal-head h3{font-size:16px; font-weight:800; color:var(--teal-900);}
.modal-body{padding:18px; display:flex; flex-direction:column; gap:13px;}
.modal-foot{display:flex; justify-content:flex-end; gap:8px; padding:14px 18px; border-top:1px solid var(--line);}
.modal.sm{max-width:400px;}
.iconbtn{width:32px; height:32px; border-radius:9px; border:1px solid transparent; background:transparent; display:flex; align-items:center; justify-content:center; color:var(--ink-faint); font-size:16px;}
.iconbtn:hover{background:var(--surface-2); color:var(--ink);}

.upload-zone{border:1.5px dashed var(--line); border-radius:12px; padding:14px; text-align:center; font-size:12.5px; color:var(--ink-faint);}
.upload-zone input{display:none;}
.thumbs{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
.thumb{position:relative; width:70px; height:70px;}
.thumb img{width:100%; height:100%; object-fit:cover; border-radius:9px; border:1px solid var(--line);}
.thumb .rm{position:absolute; top:-6px; left:-6px; width:20px; height:20px; border-radius:50%; background:var(--red-600); color:#fff; border:2px solid var(--surface); font-size:11px; display:flex; align-items:center; justify-content:center;}

.lightbox{position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:200; display:flex; align-items:center; justify-content:center; padding:30px;}
.lightbox img{max-width:100%; max-height:100%; border-radius:8px;}

.locked-note{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-faint); padding:8px 0;}
.size-warn{background:var(--amber-100); color:var(--amber-600); border-radius:10px; padding:8px 12px; font-size:12px; margin-bottom:12px;}
.size-warn.danger{background:var(--red-100); color:var(--red-600);}

.toast-wrap{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:300; display:flex; flex-direction:column; gap:8px; align-items:center;}
.toast{background:var(--teal-900); color:#fff; padding:10px 16px; border-radius:10px; font-size:13px; box-shadow:var(--shadow); animation:toastin .18s ease;}
.toast.danger{background:var(--red-600);}
@keyframes toastin{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

.mobile-toggle{display:none;}
@media (max-width:900px){
  .sidebar{position:fixed; inset:106px 0 0 0; z-index:39; background:var(--paper); width:100%; max-height:none; transform:translateX(105%); transition:transform .2s ease; padding:14px;}
  .sidebar.open{transform:translateX(0);}
  .mobile-toggle{display:inline-flex;}
  .main{padding:16px 14px 70px;}
  .profile-grid{grid-template-columns:1fr;}
  .brand-text .t2{display:none;}
  .topbar{flex-wrap:wrap; row-gap:8px; padding:10px 12px;}
  .top-actions{flex:1 1 100%; justify-content:flex-end;}
  .icon-launcher{grid-template-rows:none; grid-auto-flow:row; grid-template-columns:repeat(4,1fr); overflow-x:visible;}
  .icon-launch-btn{width:auto;}
  .home-hero{padding:18px 16px;}
  .hh-badge{width:96px; height:66px;}
}
@media (max-width:420px){
  #saveStatusText{display:none;}
  .btn span.lbl-txt{display:none;}
}
@media print{
  .topbar,.sidebar,.section-actions,.mobile-toggle,.rec-card .rc-actions,.rt td.actions,.rt th:last-child{display:none !important;}
  .main{padding:0;}
  body{background:#fff;}
}
</style>

<div id="app">
  <div class="topbar">

        <div class="t2" id="schoolNameTop">مدرسة ابتدائية النرجس الثانية للبنات</div>
      </div>
    </button>
    <div class="top-actions">
      <div class="save-status ok" id="saveStatus"><span class="save-dot"></span><span id="saveStatusText">—</span></div>

    </div>
  </div>
  <div class="shell">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main" id="main"></main>
  </div>
</div>

var TASKS_DEFAULT = "1. تشكيل فريق الأمن والسلامة في المدرسة وفق الدليل الاجرائي وتوثيق اجتماعات هذه اللجنة.\n"+
"2. دراسة الوضع الحالي وتقييم المخاطر في المدرسة، وذلك من خلال استمارة تقييم السلامة المدرسية في نظام نور.\n"+
"3. التوعية بأهمية الأمن والسلامة المدرسية وغرس مبادئ الوقاية لدى المعلمين/ات والطلاب/الطالبات داخل المدرسة وعلى المجتمع الخارجي من خلال الإذاعة المدرسية والأنشطة اللاصفية وعقد الندوات والمحاضرات وإقامة المعارض.\n"+
"4. تفعيل الأنشطة والفعاليات الخاصة بالأمن والسلامة المدرسية بمساندة مشرف/ة النشاط (اليوم العالمي للدفاع المدني/أسبوع المرور/أسبوع السلامة) والاستفادة من العلاقة مع الجهات ذات العلاقة في إقامة مثل هذه الأنشطة.\n"+
"5. تشكيل لجنة للطوارئ والاخلاء للقيام بتدريب دوري على عملية الاخلاء والانقاذ داخل المدرسة.\n"+
"6. الاجتماع الدوري بالأعضاء لمناقشة الخطط والأدوار والملاحظات على كل عملية تجربة إخلاء ومحاولة تفاديها في التجارب القادمة.\n"+
"7. الإلمام بالمبنى وما به من مداخل ومخارج، ومخارج طوارئ وكافة محتوياته من معدات وتجهيزاته وكافة أدوات السلامة والوقاية من الحريق ووسائل تشغيلها.\n"+
"8. القيام بجولات تفتيشية دورية داخل المدرسة للتأكد من صلاحية أدوات السلامة والتنسيق مع مدير/ة المدرسة لعمل الصيانة اللازمة لها وتعبئة النموذج الخاص بها.\n"+
"9. التنسيق مع مدير/ة المدرسة لإزالة المخلفات التي تمس السلامة وللتأكد من عدم وجود أي مخلفات قابلة للاشتعال، أو تشكل خطورة على المبنى مثل (القماش – سعف النخل – الأثاث التالف – الأحمال الثقيلة على التوصيلات الكهربائية – الدفايات – المداخن).\n"+
"10. التأكد من سلامة مخارج الطوارئ وعدم قفلها أو وضع عائق يحول دون استخدامها لأي سبب من الأسباب.\n"+
"11. التنسيق مع إدارة المدرسة لوضع رسم كروكي يبين موقع المدرسة والحي والأدوار الموجودة ومخارج الطوارئ ومواقع طفايات الحريق داخل فناء المدرسة وتوضع بألوان ترشد لمحتوياتهم بالمبنى.\n"+
"12. وضع استمارة إرشادية داخل كل فصل دراسي يبين فيها أقرب مخرج طوارئ، وأقرب جهاز إنذار، وأقرب طفاية حريق، وأرقام الجهات المعنية ذات العلاقة.\n"+
"13. التبليغ عن الحوادث الطارئة (سرقة، اعتداء......) وذلك من خلال نظام البلاغات المعتمد.\n"+
"14. الإلمام التام بالفصول المشغولة بالطلاب أو الطالبات ذوي الإعاقة أو المرضى لاتخاذ الإجراءات المناسبة تجاههم في حالة القيام بعملية الإخلاء.\n"+
"15. وضع لوحات إرشادية لمخارج الطوارئ ونقاط التجمع.\n"+
"16. ملف لمتابعة الأعطال والصيانة يوثق في هذا الملف كافة أعمال الصيانة التي أجريت في المدرسة.\n"+
"17. استقبال وتمرير ما يرد من معلومات من الدفاع المدني والرئاسة العامة للأرصاد الجوية وحماية البيئة من التغيرات المناخية.\n"+

var state = null;

function defaultState(){
  var s = {meta:{schoolName:SCHOOL_DEFAULT, updatedAt:null}, sections:{}};
  SECTIONS.forEach(function(cfg){
    if(cfg.kind === "profile"){
      var vals = {};
      cfg.fields.forEach(function(f){vals[f.key] = "";});
      if(cfg.id===2){ vals.schoolName = SCHOOL_DEFAULT; vals.coordinatorName = COORDINATOR_DEFAULT; }
      if(cfg.id===1){ vals.name = COORDINATOR_DEFAULT; }
      s.sections[cfg.id] = {values:vals};
    } else if(cfg.kind === "text"){
      s.sections[cfg.id] = {content: cfg.defaultText || "", images:[]};
    } else if(cfg.kind === "records"){
      var rows = (cfg.presets||[]).map(function(p){
        var r = {id:uid()};
        cfg.fields.forEach(function(f){ r[f.key] = (f.type==="images") ? [] : (p[f.key]!==undefined?p[f.key]:""); });
        return r;
      });
      s.sections[cfg.id] = {rows:rows};
    } else if(cfg.kind === "team7"){
      var groups = {};
      TEAMS7.forEach(function(t){
        groups[t.key] = t.roles.map(function(role){ return {role:role, name:"", phone:""}; });
      });
      s.sections[cfg.id] = {groups:groups};
    }
  });
  return s;
}

function uid(){ return "r"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function escapeHtml(str){
  return String(str==null?"":str).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function nl2br(str){ return escapeHtml(str).replace(/\n/g,"<br>"); }

function sectionSummary(cfg){
  var d = state.sections[cfg.id];
  if(cfg.kind === "profile"){
    var total = cfg.fields.length, filled = cfg.fields.filter(function(f){return (d.values[f.key]||"").toString().trim();}).length;
    return {text: filled ? (filled+" من "+total+" حقلاً معبأ") : "لم تتم التعبئة بعد", filled: filled>0};
  }
  if(cfg.kind === "text"){
    var has = (d.content||"").trim().length>0;
    return {text: has ? "تمت التعبئة" : "لم تتم التعبئة بعد", filled: has};
  }
  if(cfg.kind === "records"){
    var n = d.rows.length;
    return {text: n ? (n+" سجل"): "لا توجد سجلات", filled: n>0};
  }
  if(cfg.kind === "team7"){
    var totalM=0, filledM=0;
    Object.keys(d.groups).forEach(function(k){ d.groups[k].forEach(function(m){ totalM++; if((m.name||"").trim()) filledM++; }); });
    return {text: filledM ? (filledM+" من "+totalM+" عضو/ة معبأ") : "لم تتم التعبئة بعد", filled: filledM>0};
  }
  return {text:"", filled:false};
}
function overallProgress(){
  var done = SECTIONS.filter(function(cfg){ return sectionSummary(cfg).filled; }).length;
  return {done:done, total:SECTIONS.length};
}

/* ============ LOAD / SAVE (Supabase) ============ */
function mergeState(data){
  var d = defaultState();
  if(data && data.meta) d.meta = Object.assign(d.meta, data.meta);
  if(data && data.sections){
    Object.keys(data.sections).forEach(function(k){
      if(d.sections[k]) d.sections[k] = data.sections[k];
    });
  }
  return d;
}

function loadState(){
  if(!sb) return Promise.resolve(defaultState());
  return sb.from("app_state").select("data").eq("id",1).single().then(function(res){
    if(res.error || !res.data) return defaultState();
    return mergeState(res.data.data);
  }).catch(function(){ return defaultState(); });
}

function subscribeRealtime(){
  if(!sb) return;
  sb.channel("app_state_changes")
    .on("postgres_changes", {event:"UPDATE", schema:"public", table:"app_state", filter:"id=eq.1"}, function(payload){
      if(!payload || !payload.new || !payload.new.data) return;
      state = mergeState(payload.new.data);
      var activeTag = document.activeElement && document.activeElement.tagName;
      if(activeTag !== "INPUT" && activeTag !== "TEXTAREA" && activeTag !== "SELECT"){
        render();
      }
      setSaveStatus("ok", "محدّث الآن من جهاز آخر — " + nowLabel());
    })
    .subscribe();
}

function formatBytes(n){
  if(n<1024) return n+" B";
  if(n<1024*1024) return (n/1024).toFixed(0)+" KB";
  return (n/1024/1024).toFixed(1)+" MB";
}

/* ============ IMAGE COMPRESSION ============ */
function compressImage(file){
  return new Promise(function(resolve,reject){
    if(!file || !file.type || file.type.indexOf("image/")!==0){ reject(new Error("not-image")); return; }
    var img = new Image();
    var reader = new FileReader();
    reader.onload = function(e){
      img.onload = function(){
        var maxDim = 1280;
        var w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",0.68));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function bindImageUpload(scope, onOne){
  var input = scope.querySelector("[data-upload-img]");
  if(!input) return;
  input.addEventListener("change", function(){
    var files = Array.prototype.slice.call(input.files);
    Promise.all(files.map(function(f){ return compressImage(f).catch(function(){return null;}); })).then(function(list){
      list.filter(Boolean).forEach(onOne);
    });
    input.value = "";
  });
}

/* ============ RECORD MODAL ============ */
function openRecordModal(cfg, existing){
  var isEdit = !!existing;
  var draft = existing ? JSON.parse(JSON.stringify(existing)) : {id:uid()};
  cfg.fields.forEach(function(f){ if(draft[f.key]===undefined) draft[f.key] = (f.type==="images"?[]:""); });

  var root = document.getElementById("modalRoot");
  var fieldsHtml = cfg.fields.map(function(f){
    var v = draft[f.key];
    if(f.type==="images"){
      return '<div class="field-block"><label>'+escapeHtml(f.label)+'</label>'+
        '<div class="thumbs" data-thumbs></div>'+
        '<label class="upload-zone" style="display:block; margin-top:8px; cursor:pointer;">📎 إضافة صور<input type="file" accept="image/*" multiple data-modal-upload></label></div>';
    }
    if(f.type==="textarea"){
      return '<div class="field-block"><label>'+escapeHtml(f.label)+'</label><textarea data-mf="'+f.key+'">'+escapeHtml(v)+'</textarea></div>';
    }
    if(f.type==="select"){
      return '<div class="field-block"><label>'+escapeHtml(f.label)+'</label><select data-mf="'+f.key+'"><option value="">—</option>'+
        f.options.map(function(o){return '<option value="'+escapeHtml(o)+'"'+(o===v?" selected":"")+'>'+escapeHtml(o)+'</option>';}).join("")+'</select></div>';
    }
    return '<div class="field-block"><label>'+escapeHtml(f.label)+'</label><input type="'+(f.type==="number"?"number":"text")+'" data-mf="'+f.key+'" value="'+escapeHtml(v)+'"></div>';
  }).join("");

  root.innerHTML = '<div class="overlay" data-close-overlay>'+
    '<div class="modal" role="dialog" aria-modal="true">'+
    '<div class="modal-head"><h3>'+(isEdit?"تعديل سجل":"إضافة سجل جديد")+'</h3><button class="iconbtn" data-close-modal>✕</button></div>'+
    '<div class="modal-body">'+fieldsHtml+'</div>'+
    '<div class="modal-foot"><button class="btn" data-close-modal>إلغاء</button><button class="btn btn-primary" data-save-modal>حفظ</button></div>'+
    '</div></div>';

  var imgFields = cfg.fields.filter(function(f){return f.type==="images";});
  imgFields.forEach(function(f){ renderThumbs(root, f.key, draft[f.key]); });

  root.querySelectorAll("[data-modal-upload]").forEach(function(input){
    var wrap = input.closest(".field-block");
    var key = cfg.fields.filter(function(f){return f.type==="images";})[0].key;
    input.addEventListener("change", function(){
      var files = Array.prototype.slice.call(input.files);
      if(draft[key].length + files.length > 8){ showToast("الحد الأقصى 8 صور لكل سجل", true); }
      Promise.all(files.slice(0,8-draft[key].length).map(function(f){return compressImage(f).catch(function(){return null;});})).then(function(list){
        list.filter(Boolean).forEach(function(src){ draft[key].push(src); });
        renderThumbs(root, key, draft[key]);
      });
      input.value = "";
    });
  });

  function close(){ root.innerHTML = ""; }
  root.querySelectorAll("[data-close-modal]").forEach(function(el){ el.addEventListener("click", close); });
  root.querySelector("[data-close-overlay]").addEventListener("click", function(e){ if(e.target===e.currentTarget) close(); });

  root.querySelector("[data-save-modal]").addEventListener("click", function(){
    root.querySelectorAll("[data-mf]").forEach(function(el){ draft[el.getAttribute("data-mf")] = el.value; });
    var rows = state.sections[cfg.id].rows;
    if(isEdit){
      var idx = rows.findIndex(function(r){return r.id===draft.id;});
      rows[idx] = draft;
    } else {
      rows.push(draft);
    }
    close(); renderMain(); scheduleSave();
  });
}

function renderThumbs(root, key, list){
  var scopeEl = root.querySelectorAll("[data-thumbs]");
  var el = scopeEl[0];
  if(!el) return;
  el.innerHTML = list.map(function(src,i){
    return '<div class="thumb"><img src="'+src+'"><button class="rm" data-rm-thumb="'+i+'">×</button></div>';
  }).join("");
  el.querySelectorAll("[data-rm-thumb]").forEach(function(btn){
    btn.addEventListener("click", function(){
      list.splice(+btn.getAttribute("data-rm-thumb"),1);
      renderThumbs(root,key,list);
    });
  });
}

/* ============ LIGHTBOX / CONFIRM / PASSWORD ============ */
function openLightbox(src){
  var root = document.getElementById("modalRoot");
  root.innerHTML = '<div class="lightbox" data-close-overlay><img src="'+src+'"></div>';
  root.querySelector(".lightbox").addEventListener("click", function(){ root.innerHTML = ""; });
}

function confirmDialog(msg){
  return new Promise(function(resolve){
    var root = document.getElementById("modalRoot");
    root.innerHTML = '<div class="overlay"><div class="modal sm">'+
      '<div class="modal-body"><p style="margin:0; font-size:14px;">'+escapeHtml(msg)+'</p></div>'+
      '<div class="modal-foot"><button class="btn" data-no>إلغاء</button><button class="btn btn-danger" data-yes>حذف</button></div>'+
      '</div></div>';
    root.querySelector("[data-no]").addEventListener("click", function(){ root.innerHTML=""; resolve(false); });
    root.querySelector("[data-yes]").addEventListener("click", function(){ root.innerHTML=""; resolve(true); });
  });
}

function openPasswordModal(){
  var root = document.getElementById("modalRoot");
  root.innerHTML = '<div class="overlay" data-close-overlay><div class="modal sm">'+
    '<div class="modal-head"><h3>دخول المشرف</h3><button class="iconbtn" data-close-modal>✕</button></div>'+
    '<div class="modal-body">'+
    '<div class="field-block"><label>كلمة المرور</label><input type="password" id="pwInput" placeholder="أدخل كلمة مرور المشرف"></div>'+
    '<div class="locked-note" id="pwNote">🔒 وضع المشرف يتيح إضافة وتعديل البيانات والصور، وحفظها لجميع من يفتح الرابط.</div>'+
    '</div><div class="modal-foot"><button class="btn" data-close-modal>إلغاء</button><button class="btn btn-primary" id="pwSubmit">دخول</button></div>'+
    '</div></div>';
  function close(){ root.innerHTML = ""; }
  root.querySelectorAll("[data-close-modal]").forEach(function(el){ el.addEventListener("click", close); });
  root.querySelector("[data-close-overlay]").addEventListener("click", function(e){ if(e.target===e.currentTarget) close(); });
  var input = document.getElementById("pwInput");
  input.focus();
  function submit(){
    var pw = input.value;
    if(!pw) return;
    if(!sb){ showToast("تعذر الاتصال بقاعدة البيانات", true); return; }
    var btn = document.getElementById("pwSubmit");
    btn.disabled = true; btn.textContent = "جارٍ التحقق…";
    sb.rpc("verify_admin_password", {p_password: pw}).then(function(res){
      btn.disabled = false; btn.textContent = "دخول";
      if(res.error){ showToast("تعذر التحقق من كلمة المرور", true); return; }
      if(res.data === true){
        adminMode = true;
        adminPassword = pw;
        try{ sessionStorage.setItem("safety_admin_pw", pw); }catch(e){}
        close(); render();
        showToast("تم تفعيل وضع إدخال المشرف");
      } else {
        showToast("كلمة المرور غير صحيحة", true);
      }
    }).catch(function(){
      btn.disabled = false; btn.textContent = "دخول";
      showToast("تعذر الاتصال بقاعدة البيانات", true);
    });
  }
  document.getElementById("pwSubmit").addEventListener("click", submit);
  input.addEventListener("keydown", function(e){ if(e.key==="Enter") submit(); });
}

/* ============ INIT ============ */
document.getElementById("navToggle").addEventListener("click", function(){
  document.getElementById("sidebar").classList.toggle("open");
});
document.getElementById("printBtn").addEventListener("click", function(){ window.print(); });
document.getElementById("adminBtn").addEventListener("click", function(){
  if(adminMode){
    adminMode = false;
    adminPassword = null;
    try{ sessionStorage.removeItem("safety_admin_pw"); }catch(e){}
    render();
  } else {
    openPasswordModal();
  }
});
document.getElementById("app").addEventListener("click", function(e){
  var btn = e.target.closest("[data-goto]");
  if(!btn) return;
  activeId = +btn.getAttribute("data-goto");
  document.getElementById("sidebar").classList.remove("open");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
});

function boot(){
  if(!sb){ setSaveStatus("err","تعذر الاتصال بقاعدة البيانات — تحقّقي من إعداد المفاتيح"); }
  var savedPw = null;
  try{ savedPw = sessionStorage.getItem("safety_admin_pw"); }catch(e){}
  loadState().then(function(s){
    state = s;
    stateLoaded = true;
    setSaveStatus("ok", state.meta.updatedAt ? ("آخر تحديث "+new Date(state.meta.updatedAt).toLocaleString("ar-SA")) : "لا توجد تعديلات محفوظة بعد");
    if(savedPw && sb){
      sb.rpc("verify_admin_password", {p_password: savedPw}).then(function(res){
        if(res.data === true){ adminMode = true; adminPassword = savedPw; render(); }
        else { try{ sessionStorage.removeItem("safety_admin_pw"); }catch(e){} }
      }).catch(function(){});
    }
    render();
    subscribeRealtime();
  });
}
boot();

})();
</script>
